<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELORA — Shop admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231a1a1a'/><text x='50' y='68' font-size='58' font-family='Georgia,serif' text-anchor='middle' fill='%23fff'>H</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/helora.css">
<style>
  /* ------------------------------------------------------------------
     跟 helora-store 那個新網站同一套視覺。
     色值直接沿用它 src/index.css 裡的 HSL，字體也是同三款。
     只影響後台 —— 前台 index.html 維持原本的設計。
     ------------------------------------------------------------------ */
  :root {
    --bg:         hsl(37 32% 93%);   /* 暖米色底 */
    --card:       hsl(38 36% 96%);   /* 卡片、表格 */
    --ink:        hsl(27 18% 15%);   /* 標題、按鈕 */
    --body:       hsl(27 10% 39%);   /* 內文 */
    --muted:      hsl(27 10% 45%);   /* 標籤 */
    --soft:       hsl(27 10% 56%);   /* 提示、次要文字 */
    --ghost:      hsl(30 14% 66%);
    --eyebrow:    hsl(27 10% 56%);
    --line:       hsl(30 22% 79%);
    --line-soft:  hsl(35 20% 84%);
    --line-faint: hsl(35 20% 88%);
    --field:      hsl(30 22% 76%);
    --accent:     hsl(11 39% 64%);   /* 磚紅，用在必填、刪除 */

    --serif: 'Instrument Serif', Georgia, serif;
    --sans:  'Manrope', system-ui, sans-serif;
    --mono:  'DM Mono', ui-monospace, monospace;
    --radius: 4px;
  }

  body { background: var(--bg); color: var(--body); }

  /* 新站是圓角 4px，舊後台是直角 —— 統一過來 */
  .a-card, .a-table, .a-i, .a-thumb, .a-img, .a-add,
  .a-empty, .a-err, .a-msg, .btn, .btn-ghost, .a-x { border-radius: var(--radius); }
  .a-x { border-radius: 50%; }

  .a-card, .a-table { background: var(--card); }
  .a-bar { background: var(--card); }
  .a-i { background: var(--card); }
  .a-i:focus { border-color: var(--ink); box-shadow: 0 0 0 3px hsl(27 18% 15% / .07); }

  .a-h1 { letter-spacing: -.01em; }
  .a-logo { letter-spacing: .26em; }
  .a-req { color: var(--accent); }
  .a-danger:hover { color: var(--accent); }
  .a-sub code, .a-warn code { font-family: var(--mono); background: hsl(35 22% 88%); }

  .btn { background: var(--ink); }
  .btn:hover { background: hsl(27 18% 10%); }

  .a-check input { accent-color: hsl(27 18% 15%); }
  .a-off input { background: hsl(35 20% 88%); }
  .a-hint { background: hsl(38 36% 96%); border-color: var(--field); }
  .a-warn { background: hsl(38 45% 90%); border-color: hsl(35 35% 78%); color: hsl(30 30% 30%); }
  .a-msg { background: hsl(120 12% 90%); border-color: hsl(120 14% 76%); color: hsl(140 20% 26%); }
  .a-err { background: hsl(11 45% 93%); border-color: hsl(11 39% 78%); color: hsl(8 45% 38%); }

  .a-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .a-bar-r { display: flex; gap: 20px; align-items: center; }
  .a-logo { font: 500 20px/1 var(--serif); letter-spacing: .3em; text-indent: .3em; }

  /* 雙語標籤：中文為主，英文小一點放旁邊 */
  .a-en { font: 400 10.5px/1 var(--sans); letter-spacing: .06em; color: var(--soft); margin-left: 5px; text-transform: none; }
  .a-h1 .a-en { font-size: 14px; }

  /* 上方分頁 */
  .a-nav { display: flex; gap: 4px; }
  .a-tab {
    font: 500 11.5px/1 var(--sans); letter-spacing: .1em; color: var(--muted);
    padding: 9px 14px; border-bottom: 2px solid transparent; cursor: pointer; background: none;
  }
  .a-tab:hover { color: var(--ink); }
  .a-tab.is-on { color: var(--ink); border-bottom-color: var(--ink); }

  .a-note { font: 400 11.5px/1.6 var(--sans); color: var(--soft); margin: -10px 0 16px; }
  .a-mini {
    font: 500 11px/1 var(--sans); letter-spacing: .06em; color: var(--muted);
    border-bottom: 1px solid var(--field); cursor: pointer; background: none; padding: 0 0 1px;
  }
  .a-mini:hover { color: var(--ink); border-color: var(--ink); }

  /* 表格裡的小輸入框 */
  .a-i-sm { margin-bottom: 0; padding: 8px 10px; font-size: 13px; }
  .a-i-num { width: 70px; text-align: center; }
  .a-i-wide { min-width: 240px; }
  .a-center-c { text-align: center; }
  .a-off { opacity: .45; }
  .a-off input { background: #f6f4f0; }
  .a-off .a-link { opacity: 1; }   /* 停用的欄位仍要能按啟用/刪除 */

  .a-center { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; }
  .a-card { background: #fff; border: 1px solid var(--line); padding: 40px; width: 100%; max-width: 560px; }
  .a-wrap { max-width: 1000px; margin: 0 auto; padding: 34px 28px 90px; }

  .a-h1 { font: 500 30px/1.2 var(--serif); margin: 18px 0 24px; }
  .a-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
  .a-head .a-h1 { margin: 0; }
  .a-count { font: 400 14px/1 var(--sans); color: var(--soft); vertical-align: middle; margin-left: 6px; }

  .a-l { display: block; font: 500 10.5px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .a-i {
    width: 100%; border: 1px solid var(--field); background: #fff;
    padding: 12px 13px; font: 400 14px/1.4 var(--sans); outline: none;
    transition: border-color .2s; margin-bottom: 16px;
  }
  .a-i:focus { border-color: var(--ink); }
  textarea.a-i { resize: vertical; }

  .a-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
  .a-f.a-full { grid-column: 1 / -1; }

  .a-checks { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-bottom: 20px; }
  .a-check { display: flex; align-items: center; gap: 8px; font: 400 13.5px/1 var(--sans); color: var(--body); cursor: pointer; }
  .a-check input { width: 15px; height: 15px; accent-color: #1a1a1a; }

  .a-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); }
  .a-table th {
    text-align: left; font: 500 10px/1 var(--sans); letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted); padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  .a-table td { padding: 12px 16px; border-bottom: 1px solid var(--line-faint); font: 400 13.5px/1.5 var(--sans); vertical-align: middle; }
  .a-table tr:last-child td { border-bottom: none; }
  .a-right { text-align: right; white-space: nowrap; }
  .a-name { font-weight: 500; color: var(--ink); }
  .a-sub  { font: 400 12px/1.6 var(--sans); color: var(--soft); }
  .a-sub code { background: #f3f1ec; padding: 2px 5px; font-size: 11.5px; }

  .a-thumb { width: 46px; height: 46px; object-fit: cover; border: 1px solid var(--line); display: block; }
  .a-thumb-empty { background: #f3f1ec; }

  .a-link {
    font: 500 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); cursor: pointer; background: none; border: none; padding: 6px 8px;
    text-decoration: none;
  }
  .a-link:hover { color: var(--ink); }
  .a-danger:hover { color: #a4443a; }

  .a-empty { background: #fff; border: 1px dashed var(--field); padding: 60px 30px; text-align: center; font: 300 15px/1.8 var(--sans); color: var(--soft); }

  .a-err { background: #fdf1ef; border: 1px solid #e8c8c2; color: #8f3a30; padding: 12px 14px; font: 400 13px/1.6 var(--sans); margin: 12px 0; }
  .a-msg { background: #f3f6f1; border: 1px solid #cfdcc7; color: #4a5f3f; padding: 12px 14px; font: 400 13px/1.6 var(--sans); margin-bottom: 18px; }

  /* 區塊標題 */
  .a-sec {
    font: 500 11px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink); margin: 34px 0 16px; padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .a-sec:first-of-type { margin-top: 8px; }
  .a-req { color: #b06a5e; letter-spacing: .1em; margin-left: 6px; }
  .a-hint { background: #fbfaf8; border: 1px dashed var(--field); padding: 14px 16px; }

  /* 進階設定收合區 */
  .a-adv { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 18px; }
  .a-adv > summary {
    cursor: pointer; list-style: none;
    font: 400 12.5px/1.5 var(--sans); color: var(--muted);
    padding: 6px 0; user-select: none;
  }
  .a-adv > summary::-webkit-details-marker { display: none; }
  .a-adv > summary::before { content: '▸ '; color: var(--soft); }
  .a-adv[open] > summary::before { content: '▾ '; }
  .a-adv > summary:hover { color: var(--ink); }

  .a-warn { background: #fdf6e7; border-color: #efe2c4; color: #6b5a2e; }
  .a-warn code { background: #f3ead6; padding: 2px 5px; font-size: 11.5px; }

  .a-photos { margin: 26px 0; }
  .a-imgs { display: flex; flex-wrap: wrap; gap: 12px; }
  .a-img { position: relative; width: 104px; height: 104px; border: 1px solid var(--line); }
  .a-img img { width: 100%; height: 100%; object-fit: cover; }
  .a-x {
    position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%;
    background: #1a1a1a; color: #fff; font-size: 15px; line-height: 24px; text-align: center; cursor: pointer;
  }
  .a-add {
    width: 104px; height: 104px; border: 1px dashed var(--field); display: grid; place-items: center;
    cursor: pointer; font: 400 11.5px/1.4 var(--sans); color: var(--muted); text-align: center; padding: 8px;
  }
  .a-add:hover { border-color: var(--ink); color: var(--ink); }

  .a-actions { display: flex; align-items: center; gap: 16px; margin-top: 26px; }

  @media (max-width: 720px) {
    .a-grid { grid-template-columns: 1fr; }
    .a-wrap, .a-card { padding-left: 18px; padding-right: 18px; }
    .a-table thead { display: none; }
    .a-table, .a-table tbody, .a-table tr, .a-table td { display: block; width: 100%; }
    .a-table tr { border-bottom: 1px solid var(--line); padding: 12px 4px; }
    .a-table td { border: none; padding: 4px 12px; }
    .a-right { text-align: left; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./js/admin.js"></script>
</body>
</html>
